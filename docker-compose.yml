# Local Upstash-compatible Redis for testing replay protection without a cloud account.
#
#   docker compose up -d
#
# then set these in .dev.vars (Cloudflare) or .env.local (Vercel):
#   UPSTASH_REDIS_REST_URL=http://localhost:8079
#   UPSTASH_REDIS_REST_TOKEN=local_token
#
# `redis-rest` (serverless-redis-http) speaks the Upstash REST API that
# @upstash/redis expects, backed by a real Redis — so SET NX atomicity is real.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-rest:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      - redis
